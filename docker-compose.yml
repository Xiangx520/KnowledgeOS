name: rag-knowledge-assistant

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: ${RAG_BACKEND_IMAGE:-rag-knowledge-assistant-backend:local}
  restart: unless-stopped
  mem_limit: ${RAG_SERVICE_MEMORY:-4g}
  cpus: ${RAG_SERVICE_CPUS:-2.0}
  pids_limit: 256
  environment: &backend-env
    RAG_ENVIRONMENT: production
    RAG_DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/rag
    RAG_DATA_DIR: /app/data
    RAG_SECRET_KEY: ${RAG_SECRET_KEY:?Set RAG_SECRET_KEY}
    RAG_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    RAG_QDRANT_URL: http://qdrant:6333
    RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:?Set RAG_QDRANT_API_KEY}
    RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-sentence-transformers}
    RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
    RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-512}
    RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-}
    RAG_RERANKER_PROVIDER: ${RAG_RERANKER_PROVIDER:-local}
    RAG_RERANKER_API_URL: ${RAG_RERANKER_API_URL:-}
    RAG_RERANKER_API_KEY: ${RAG_RERANKER_API_KEY:-}
    RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://api.openai.com/v1}
    RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
    RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
    RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
    RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
    RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-8}
    RAG_EMBEDDING_NUM_CTX: ${RAG_EMBEDDING_NUM_CTX:-4096}
    RAG_OLLAMA_NUM_CTX: ${RAG_OLLAMA_NUM_CTX:-16384}
    RAG_MODEL_TIMEOUT: ${RAG_MODEL_TIMEOUT:-240}
    RAG_MAX_OUTPUT_TOKENS: ${RAG_MAX_OUTPUT_TOKENS:-2048}
    RAG_QDRANT_COLLECTION_PREFIX: rag_assistant
    RAG_VISION_MODEL: ${RAG_VISION_MODEL:-}
    RAG_OCR_ENABLED: ${RAG_OCR_ENABLED:-true}
    RAG_AUTO_MIGRATE: "false"
    RAG_ALLOW_REGISTRATION: ${RAG_ALLOW_REGISTRATION:-true}
    RAG_PUBLIC_BASE_URL: ${RAG_PUBLIC_BASE_URL:-http://localhost:8080}
    RAG_COOKIE_SECURE: ${RAG_COOKIE_SECURE:-false}
    RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
    RAG_AUTH_RATE_PER_MINUTE: ${RAG_AUTH_RATE_PER_MINUTE:-20}
    RAG_CHAT_RATE_PER_MINUTE: ${RAG_CHAT_RATE_PER_MINUTE:-30}
    RAG_USER_STORAGE_MB: ${RAG_USER_STORAGE_MB:-1024}
    RAG_MAX_PENDING_JOBS: ${RAG_MAX_PENDING_JOBS:-20}
    RAG_MAX_ACTIVE_CHATS: ${RAG_MAX_ACTIVE_CHATS:-2}
    RAG_GLOBAL_ACTIVE_CHATS: ${RAG_GLOBAL_ACTIVE_CHATS:-4}
    RAG_USER_DAILY_MODEL_REQUESTS: ${RAG_USER_DAILY_MODEL_REQUESTS:-500}
    RAG_PLATFORM_ADMIN_EMAILS: ${RAG_PLATFORM_ADMIN_EMAILS:-[]}
    RAG_PDF_VISION_ALL_PAGES: ${RAG_PDF_VISION_ALL_PAGES:-false}
    RAG_OCR_TIMEOUT: ${RAG_OCR_TIMEOUT:-60}
    RAG_CITATION_VERIFIER: ${RAG_CITATION_VERIFIER:-numeric}
    RAG_VERIFIER_MODEL: ${RAG_VERIFIER_MODEL:-}
    RAG_EVIDENCE_MIN_COVERAGE: ${RAG_EVIDENCE_MIN_COVERAGE:-0.25}
    RAG_METRICS_TOKEN: ${RAG_METRICS_TOKEN:-}
    RAG_OIDC_ISSUER: ${RAG_OIDC_ISSUER:-}
    RAG_OIDC_CLIENT_ID: ${RAG_OIDC_CLIENT_ID:-}
    RAG_OIDC_CLIENT_SECRET: ${RAG_OIDC_CLIENT_SECRET:-}
    RAG_OIDC_REDIRECT_URI: ${RAG_OIDC_REDIRECT_URI:-http://localhost:8080/api/auth/oidc/callback}
    HF_HOME: /app/data/models
  volumes:
    - app-data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 15
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${RAG_QDRANT_API_KEY:?Set RAG_QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
  migrate:
    <<: *backend
    command: [python, -m, app.maintenance, migrate]
    restart: "no"
    healthcheck:
      disable: true
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${RAG_API_PORT:-8010}:8000
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    environment:
      <<: *backend-env
      RAG_WORKER_ROLE: ingestion
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, app.health, worker]
      interval: 30s
      timeout: 10s
      start_period: 60s
  evaluation-worker:
    <<: *backend
    command: [python, -m, app.worker]
    environment:
      <<: *backend-env
      RAG_WORKER_ROLE: evaluation
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, app.health, worker]
      interval: 30s
      timeout: 10s
      start_period: 60s
  web:
    image: ${RAG_WEB_IMAGE:-rag-knowledge-assistant-web:local}
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - ${RAG_WEB_PORT:-8080}:80
    depends_on:
      api:
        condition: service_healthy

volumes:
  app-data:
  postgres-data:
  redis-data:
  qdrant-data:
